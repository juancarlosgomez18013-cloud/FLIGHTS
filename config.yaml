# ════════════════════════════════════════════════════════════════════
#  Rastreador de viajes baratos · configuración
#
#  Todos los precios son en pesos colombianos, IDA Y VUELTA, 1 adulto.
#  Cada ruta se busca de dos formas: sin maleta (tarifa básica) y con
#  1 maleta facturada. El aviso muestra los dos precios; cuál de ellos
#  decide si algo es 🔥 o 👍 se elige por tipo de viaje o por zona (bags).
#
#  Para cambiar algo, edita este archivo en GitHub y guarda (commit):
#  el sistema lo toma solo en la siguiente búsqueda.
# ════════════════════════════════════════════════════════════════════

home: BGA          # tu aeropuerto: Bucaramanga (Palonegro)
currency: COP
country: CO        # mercado de Google Flights (qué aerolíneas y precios muestra)
language: es

# Desde dónde se busca cada tipo de viaje
origins:
  domestic: [BGA]            # nacionales: salen de Bucaramanga
  international: [BOG, MDE]  # internacionales: salen de Bogotá o Medellín
                             # (el aviso te suma la conexión ida y vuelta desde Bucaramanga)

# Cuántos meses hacia adelante mirar (fecha de ida)
months_ahead:
  domestic: 6
  international: 9

# ── Cuánto dura el viaje: [mínimo, máximo] de noches ────────────────
#  Una sola búsqueda a Google trae todas las combinaciones de ida y
#  vuelta dentro del rango, así que un rango amplio no cuesta más.
#  Se puede cambiar por zona con `nights: [3, 4]`.
nights:
  domestic: [2, 5]           # fines de semana y puentes
  international: [6, 14]     # una o dos semanas

# ── Maleta: qué precio decide el 🔥 ─────────────────────────────────
#  true  = el precio con 1 maleta facturada
#  false = el precio sin maleta (tarifa básica)
#  El otro precio siempre se muestra en el aviso como referencia.
#  Se puede cambiar por zona con `bags: true` o `bags: false`.
bags:
  domestic: false            # escapada corta: con la maleta de mano basta
  international: true        # viaje largo: casi siempre se lleva maleta

# ── Cómo se decide qué es barato ─────────────────────────────────────
#
#  🔥 SÚPER BARATO → te llega un mensaje apenas lo encuentro.
#  👍 BARATO       → aparece en el resumen diario de las 7:30 a. m.
#
#  "Precio normal" de una ruta = lo que cuesta la mayoría de sus viajes
#  (todas las combinaciones de fecha de ida y vuelta).
#
#  Etapa 1 (primeras semanas): cada ruta se compara con sus otros viajes.
#  Etapa 2 (automática cuando la ruta ya tiene historial suficiente):
#     se compara con lo que esa ruta ha costado en el tiempo.
#
#  Además puedes fijar tus propios precios por destino (ver ZONAS abajo).
levels:
  cheap_below_normal: 20        # 👍 si está 20 % o más bajo el precio normal
  super_below_normal: 25        # 🔥 si está 25 % o más bajo el precio normal…
  super_below_cheap_dates: 15   #    …y 15 % bajo los viajes más baratos de siempre
                                #    (así la tarifa promo de todos los días no cuenta como 🔥)
  history_min_days: 14          # días de seguimiento antes de pasar a la etapa 2
  history_min_runs: 20          # y mínimo de búsquedas guardadas
  super_percentile: 10          # etapa 2: 🔥 si está en el 10 % más barato de lo visto…
  super_min_discount: 20        #    …y al menos 20 % bajo lo que suele costar
  cheap_percentile: 25          # etapa 2: 👍 si está en el 25 % más barato de lo visto…
  cheap_min_discount: 10        #    …y al menos 10 % bajo lo que suele costar

# ── Avisos 🔥 ────────────────────────────────────────────────────────
#  Cada oferta se avisa una vez. Se vuelve a avisar si baja otro 5 %,
#  o si desaparece y después vuelve a aparecer.
alerts:
  repeat_if_drops_percent: 5
  quiet_hours: [22, 6]          # de 10 p. m. a 6 a. m. llegan sin sonido (Telegram)

# ── Resumen diario (🔥 y 👍) ─────────────────────────────────────────
summary:
  max_per_section: 8            # máximo de destinos por sección
  extra_dates: 3                # cuántas otras fechas baratas mostrar por destino
  send_when_empty: true         # si no hay nada barato, igual manda un mensaje corto

search:
  request_delay_seconds: 2.0    # pausa entre búsquedas para que Google no bloquee
  max_days_ahead: 300
  both_bag_prices: true         # consultar también el precio con la otra maleta
                                # (solo alrededor de cada oferta; pocas peticiones extra)
  parallel_requests: 3          # peticiones a Google a la vez dentro de una búsqueda

# Conexiones desde casa hacia los aeropuertos internacionales. Se buscan
# ida y vuelta con las fechas del viaje y se suman para dar el total.
feeders:
  - from: BGA
    to: BOG
  - from: BGA
    to: MDE

# ════════════════════════════════════════════════════════════════════
#  ZONAS
#
#  Cada destino es "CÓDIGO: Ciudad". Si quieres un precio fijo propio
#  (además de la comparación automática), escríbelo así:
#
#      CTG: {ciudad: Cartagena, super_barato: 250000, barato: 320000}
#
#  Con eso, cualquier viaje a 250.000 o menos es 🔥 y a 320.000 o menos
#  es 👍 (ida y vuelta, con la maleta que decida la zona).
#
#  Por zona también puedes poner `nights: [3, 4]` o `bags: true`.
# ════════════════════════════════════════════════════════════════════
zones:

  # ─────────────── COLOMBIA (desde Bucaramanga) ───────────────

