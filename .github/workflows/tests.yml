name: Pruebas

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Corrida simulada de punta a punta
        run: |
          H=$(mktemp -d)/history.json
          python -m cheapflights zonas
          python -m cheapflights --history "$H" buscar --mock --dry-run --tipo todo
          python -m cheapflights --history "$H" resumen --dry-run
          python -m cheapflights --history "$H" plan --dry-run
          python -m cheapflights --history "$H" probar --dry-run
