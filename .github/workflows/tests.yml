name: Pruebas

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Corrida simulada de punta a punta
        run: |
          python -m cheapflights routes
          python -m cheapflights run --mock --dry-run --kind all
          python -m cheapflights digest --dry-run
