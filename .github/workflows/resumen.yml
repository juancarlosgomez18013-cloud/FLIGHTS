name: Resumen diario

# El resumen de las 7:30 a. m. lo manda el goteo apenas pasa la hora (las tareas programadas de
# GitHub llegan horas tarde). Esto es solo para mandarlo a mano: Actions → Resumen diario → Run workflow.
on:
  workflow_dispatch:

jobs:
  resumen:
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: resumen
    secrets: inherit
