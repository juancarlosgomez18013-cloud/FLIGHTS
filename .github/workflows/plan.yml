name: Plan semanal

# El plan de los lunes lo manda el goteo junto con el resumen de las 7:30 a. m. (las tareas
# programadas de GitHub llegan horas tarde). Esto es solo para mandarlo a mano.
on:
  workflow_dispatch:

jobs:
  plan:
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: plan
    secrets: inherit
