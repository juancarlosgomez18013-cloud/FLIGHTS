name: Vuelos (goteo)

# Goteo: una tarea de unas 3-4 horas que hace 7 tandas pequeñas, una cada ~media hora. Cada tanda
# busca solo las rutas que ya "tocan" (Colombia cada 6 horas, internacional cada 24), las más
# atrasadas primero y máximo 6. Así nunca hay ráfagas grandes, que es lo que hace que Google frene.
# La primera tanda después de las 7:30 a. m. manda también el resumen del día (y los lunes el plan).
#
# El ritmo lo lleva la propia tarea porque el reloj de GitHub se atrasa y a veces se salta horas
# enteras. Al terminar, cada tarea lanza la siguiente (job "siguiente"), así nunca queda un hueco.
# El horario de abajo es solo el respaldo por si la cadena se corta (p. ej. si una tarea falla).
# Ajustes en config.yaml (search).
on:
  schedule:
    - cron: "23 * * * *"   # respaldo: deja lista la siguiente tarea
  workflow_dispatch:
  # También una vez cuando cambia el código o la configuración, para verificar al instante.
  push:
    paths:
      - "cheapflights/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/_run.yml"
      - ".github/workflows/goteo.yml"

jobs:
  goteo:
    # Los push de otras ramas no buscan ni avisan.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: buscar --goteo
      repeat: 7
      pause_minutes: 25
      timeout_minutes: 330
    secrets: inherit

  siguiente:
    # Encadena la siguiente tarea apenas termina esta. Solo si salió bien: si falla, el horario de
    # respaldo la reintenta (así un error repetido no se convierte en una ráfaga de avisos).
    needs: goteo
    if: needs.goteo.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run goteo.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
