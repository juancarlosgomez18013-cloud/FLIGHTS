name: Vuelos (goteo)

# Una corrida pequeña cada hora: busca solo las rutas que ya "tocan" (Colombia cada 6 horas,
# internacional cada 24), las más atrasadas primero y máximo 10 por corrida. Así nunca hay
# ráfagas grandes, que es lo que hace que Google frene. Ajustes en config.yaml (search).
on:
  schedule:
    - cron: "23 * * * *"   # cada hora, al minuto 23
  workflow_dispatch:
  # También una vez cuando cambia el código o la configuración, para verificar al instante.
  push:
    paths:
      - "cheapflights/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/_run.yml"
      - ".github/workflows/goteo.yml"

jobs:
  goteo:
    # Los push de otras ramas no buscan ni avisan.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: buscar --goteo
    secrets: inherit
