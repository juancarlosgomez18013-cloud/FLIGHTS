name: Vuelos (goteo)

# Goteo: una tarea de unas 4 horas que hace 5 tandas pequeñas, una cada ~hora. Cada tanda busca
# solo las rutas que ya "tocan" (Colombia cada 6 horas, internacional cada 24), las más atrasadas
# primero y máximo 10. Así nunca hay ráfagas grandes, que es lo que hace que Google frene.
#
# El ritmo lo lleva la propia tarea porque el reloj de GitHub se atrasa hasta 3 horas. El horario
# de abajo es solo el respaldo: mientras una tarea corre, la siguiente queda en espera y arranca
# apenas termine, así nunca queda un hueco. Ajustes en config.yaml (search).
on:
  schedule:
    - cron: "23 * * * *"   # respaldo: deja lista la siguiente tarea
  workflow_dispatch:
  # También una vez cuando cambia el código o la configuración, para verificar al instante.
  push:
    paths:
      - "cheapflights/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/_run.yml"
      - ".github/workflows/goteo.yml"

jobs:
  goteo:
    # Los push de otras ramas no buscan ni avisan.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: buscar --goteo
      repeat: 5
      pause_minutes: 50
      timeout_minutes: 330
    secrets: inherit
