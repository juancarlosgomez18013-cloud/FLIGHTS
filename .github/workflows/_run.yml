# Workflow reutilizable: instala, corre el comando y guarda data/history.json en git.
name: _run

on:
  workflow_call:
    inputs:
      command:
        description: "Argumentos para python -m cheapflights"
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN: { required: false }
      TELEGRAM_CHAT_ID: { required: false }
      WHAPI_TOKEN: { required: false }
      WHAPI_PHONE: { required: false }
      CALLMEBOT_PHONE: { required: false }
      CALLMEBOT_APIKEY: { required: false }
      NTFY_TOPIC: { required: false }
      NTFY_SERVER: { required: false }

permissions:
  contents: write

# Las búsquedas no corren a la vez (todas reescriben el historial). Resumen, plan y prueba
# van aparte: si compartieran la cola, GitHub cancelaría en silencio la que quede pendiente.
concurrency:
  group: ${{ startsWith(inputs.command, 'buscar') && 'cheapflights-data' || format('cheapflights-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_PHONE: ${{ secrets.WHAPI_PHONE }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          FLI_TIMEOUT: "45"
        run: python -m cheapflights ${{ inputs.command }}

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "cheapflights-bot"
          git config user.email "cheapflights-bot@users.noreply.github.com"
          if [ ! -f data/history.json ]; then
            echo "No se generó historial en esta corrida"
            exit 0
          fi
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
            exit 0
          fi
          git commit -m "data: precios $(date -u +'%Y-%m-%d %H:%M UTC') (${{ inputs.command }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "No se pudo subir el historial" >&2
          exit 1
