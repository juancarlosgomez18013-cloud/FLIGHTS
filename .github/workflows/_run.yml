# Workflow reutilizable: instala, corre el comando y guarda data/history.json en git.
name: _run

on:
  workflow_call:
    inputs:
      command:
        description: "Argumentos para python -m cheapflights"
        required: true
        type: string
    secrets:
      CALLMEBOT_PHONE:
        required: false
      CALLMEBOT_APIKEY:
        required: false

permissions:
  contents: write

# Nunca dos corridas a la vez: ambas escriben data/history.json.
concurrency:
  group: cheapflights-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ejecutar
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FLI_TIMEOUT: "45"
        run: python -m cheapflights ${{ inputs.command }}

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "cheapflights-bot"
          git config user.email "cheapflights-bot@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
            exit 0
          fi
          git commit -m "data: precios $(date -u +'%Y-%m-%d %H:%M UTC') (${{ inputs.command }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "No se pudo subir el historial" >&2
          exit 1
