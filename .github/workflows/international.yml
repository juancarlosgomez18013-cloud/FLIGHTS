name: Vuelos internacionales (completa, a mano)

# Búsqueda completa de todas las rutas internacionales de una vez (unos 50 minutos). Ya no corre
# sola: las búsquedas automáticas las hace el goteo cada hora (goteo.yml). Útil para lanzarla a
# mano: Actions → "Vuelos internacionales (completa, a mano)" → Run workflow.
on:
  workflow_dispatch:

jobs:
  international:
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: buscar --tipo internacional
    secrets: inherit
