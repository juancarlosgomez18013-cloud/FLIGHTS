name: Vuelos internacionales

on:
  schedule:
    # Una vez al día, 09:40 UTC = 04:40 Colombia. Los precios internacionales se mueven más lento.
    - cron: "40 9 * * *"
  workflow_dispatch:

jobs:
  international:
    # El workflow interno guarda data/history.json en el repo: necesita escribir.
    # Sin esto GitHub rechaza la corrida al arrancar (startup_failure).
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: run --kind international
    secrets: inherit
