name: Vuelos Colombia (completa, a mano)

# Búsqueda completa de todas las rutas de Colombia de una vez. Ya no corre sola: las búsquedas
# automáticas las hace el goteo cada hora (goteo.yml). Útil para lanzarla a mano:
# Actions → "Vuelos Colombia (completa, a mano)" → Run workflow.
on:
  workflow_dispatch:

jobs:
  domestic:
    permissions:
      contents: write
    uses: ./.github/workflows/_run.yml
    with:
      command: buscar --tipo nacional
    secrets: inherit
